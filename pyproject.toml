[project]
name = "die-souveraene-zivilisation"
version = "0.1.0"
description = "Buchprojekt: Zweiter Band der Reihe *Das politische Profil – Die Architektur der Freiheit*. Dieses Werk entwickelt das Konzept der digitalen Souveränität und der lebenden Demokratie weiter."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "manuscripta>=0.6.1,<1",
    "manuscript-tools>=0.6.0,<1",
]

[[project.authors]]
name = "Asterios Raptis"
email = "asteri.raptis@gmail.com"

[build-system]
requires = [ "poetry-core>=2.0.0,<3.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pandoc_batch]
root = "manuscript"
outdir = "output"
to = "epub"
metadata_file = "config/metadata.yaml"
resource_path = [ "assets",]
lang = "en"
jobs = 4
verbose = true
standalone = true
test_only = false
patch_md = true
fix_inplace = false

[tool.codespell]
ignore-words-list = "prozess"
